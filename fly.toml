# Fly.io config — the whole product: the API plus the React app it serves.
# One origin means no CORS to configure and one URL for the clinic.
#
# Singapore region: clinical text must not leave SG-adjacent infrastructure
# unnecessarily, and latency to the clinic matters.
#
# Exactly ONE machine, never auto-stopped: claims live in an in-memory store
# (a privacy feature — nothing persists), so a second machine or a mid-review
# stop/start would lose or split claims.
#
# ALWAYS DEPLOY WITH:  fly deploy --ha=false
# min_machines_running below does NOT stop this. Fly's default is to add a
# second machine for high availability, which silently breaks the app: a claim
# created on machine A 404s when the approve request lands on machine B. The
# first deploy did exactly that and needed `fly scale count 1` to undo.
#
# Required secret (fly secrets set NAME=value):
#   ANTHROPIC_API_KEY   - LLM calls

app = "claimfill"
primary_region = "sin"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
