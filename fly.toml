# Fly.io config — the whole product: the API plus the React app it serves.
# One origin means no CORS to configure and one URL for the clinic.
#
# Singapore region: clinical text must not leave SG-adjacent infrastructure
# unnecessarily, and latency to the clinic matters.
#
# The app is STATELESS as of 2026-08-04 — no claim store, no session, nothing
# held between requests. Everything below that used to be a correctness
# constraint is now only a cost and latency choice.
#
# What that retired, so nobody reinstates it out of caution:
#   - `--ha=false` is no longer load-bearing. It used to be: a claim created on
#     machine A 404'd when approve landed on machine B. Any number of machines
#     is now correct. Keep --ha=false anyway while this is a pilot, because one
#     machine is cheaper and easier to reason about, not because two would
#     break it.
#   - Scaling to zero can no longer lose a claim, because there is no claim to
#     lose. "suspend" is kept over "stop" purely because restoring from a
#     memory snapshot is faster.
#
# Region is still a real constraint: clinical text should not leave SG-adjacent
# infrastructure unnecessarily, so primary_region stays "sin".
#
# Cold start after an idle period is a second or two — measured at 5.7s on
# 2026-08-03, which is fine for the extension's API calls and poor for a
# landing page. Set min_machines_running = 1 when the site goes public.
#
# Required secret (fly secrets set NAME=value):
#   ANTHROPIC_API_KEY   - LLM calls. Already set on this app; secrets survive
#                         deploys, so it does not need re-setting.

app = "claimfill"
primary_region = "sin"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# Watch this one now that the app scales to zero: if the machine never reaches
# a stopped/suspended state while idle, this check is the first suspect —
# something polling every 30s is the obvious candidate for keeping it awake.
# Confirm with `fly status` after an idle period before blaming the config.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
